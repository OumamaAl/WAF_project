# XSS 

SecRule ARGS:name|ARGS:mtxMessage|ARGS:txtName "@rx (?i)\b(document\.cookie|document\.write|window\.location)\s*[\=\.]" \
"id:11030,phase:2,block,msg:'Real JS execution attempt detected'"


SecRule ARGS:name|ARGS:mtxMessage|ARGS:txtName "@rx (?i)\b(window|document|self|top)\[[^\]]+\]\s*[\=\.]" \
"id:11031,phase:2,block,msg:'JS global object misuse detected'"


SecRule ARGS:name|ARGS:mtxMessage|ARGS:txtName "@rx (?i)<[^>]+\\bon(?:click|error|load|focus|blur|submit|change|mouseover|keydown|keyup)\\s*="
    "id:1101201,phase:2,block,msg:'Real event handler injection detected'"




# SQLI 

SecRule ARGS:id "@rx (?i:\b(union\s+select|select\s+from|drop\s+table|xp_cmdshell)\b)" \
    "id:11094201,phase:2,block,t:lowercase,msg:'High Confidence SQL Injection',tag:'attack-sqli',severity:'CRITICAL',setvar:'tx.anomaly_score_pl1=+12'"



SecRule ARGS:id "@rx (?i:;\s*(?:shutdown|drop|exec|xp_)|/\*.*?\*/|--)" \
    "id:11094202,phase:2,block,t:none,t:urlDecodeUni,msg:'Suspicious SQL Comment/Statement',severity:CRITICAL,setvar:tx.anomaly_score_pl1=+10"


