# XSS


SecRuleRemoveById 941310

SecRule REQUEST_URI "@beginsWith /vulnerabilities/xss" \
"id:10051,phase:1,pass,nolog,\
ctl:ruleRemoveTargetById=941180;ARGS:name, \
ctl:ruleRemoveTargetById=941180;ARGS:mtxMessage, \
ctl:ruleRemoveTargetById=941180;ARGS:txtName"


