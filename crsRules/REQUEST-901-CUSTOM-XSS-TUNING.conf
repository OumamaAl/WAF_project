SecRule ARGS:name|ARGS:mtxMessage|ARGS:txtName "@rx (?i:\b(javascript|vbscript|data):\s*)" \
    "id:1002101,\
    phase:2,\
    t:none,t:utf8toUnicode,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:cssDecode,t:removeNulls,t:lowercase,\
    msg:'Custom XSS Detection - URI Schemes',\
    tag:'attack-xss',\
    severity:'CRITICAL',\
    setvar:'tx.xss_score=+5',\
    setvar:'tx.anomaly_score_pl1=+5'"





SecRule ARGS:name|ARGS:mtxMessage|ARGS:txtName "@rx (?i:(javascript|vbscript|data):.*(?:alert|prompt|confirm|document\.cookie))" \
    "id:1002102,\
    phase:2,\
    t:none,t:utf8toUnicode,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:cssDecode,t:removeNulls,t:lowercase,\
    msg:'High Confidence XSS Attempt',\
    tag:'attack-xss',\
    severity:'CRITICAL',\
    block,\
    setvar:'tx.anomaly_score_pl1=+10'"